name: Python tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test analytical core
        run: python -m pytest -q
      - name: Verify technical smoke cases
        run: python cli.py validate examples/TECHNICAL_SMOKE_3_CASES.csv
